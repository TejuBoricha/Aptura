name: Agent status

# Every wait between agents has a deadline (docs/AGENT_WORKFLOW.md, "Nothing waits without a deadline"). This finds
# the waits that passed it, posts one `To: all` comment on each (which wakes the agents waiting on that pull request
# or debate), and keeps a one-page summary in the issue labelled `agent-status` for the owner. It runs no AI model
# and needs no secret.
#
# Two clocks drive it. GitHub's schedule is best effort: on this repository it did not fire once in the first hours
# after it was added, and GitHub may delay or drop scheduled runs and pauses them after 60 days without activity. So
# the check also runs whenever the owner's account, which every agent posts through, acts: a comment, a review, a
# push to one of its branches, an issue opened, labelled or closed. Those runs are throttled to one per 5 minutes.
# A stranger's activity never triggers it. The status issue shows when it last ran; run it from the Actions tab to
# refresh it by hand.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  issues:
    types: [opened, labeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-status
  cancel-in-progress: false

jobs:
  status:
    # Only the owner's account (every agent) and the clocks start a run. Pull requests from forks are excluded too:
    # their token cannot write, so the run could only fail.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.actor == github.repository_owner &&
       (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always main's code, whatever event started the run: a pull request must not run its own copy with write access.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Find stalled work and announce it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            python3 tools/agents/stalls.py --nudge
          else
            python3 tools/agents/stalls.py --nudge --min-gap 5
          fi
