name: Agent status

# Every wait between agents has a deadline (docs/AGENT_WORKFLOW.md, "Nothing waits without a deadline"). This finds
# the waits that passed it, posts one `To: all` comment on each (which wakes the agents waiting on that pull request
# or debate), and keeps a one-page summary in the issue labelled `agent-status` for the owner. It runs no AI model
# and needs no secret.
#
# GitHub's schedule is best effort: on this repository it did not fire once in the first hours after it was added,
# and GitHub may delay or drop scheduled runs and pauses them after 60 days without activity. So the check also runs
# whenever the owner's account, which every agent posts through, comments or opens, labels or closes an issue. Those
# runs are throttled to one per 5 minutes, and a run that the throttle would skip waits out the gap instead.
#
# A run that sees a `To:` deadline within the next 35 minutes waits for it and checks again. The comment that created
# the wait is itself the activity that started the run, so that run is the clock for a stretch in which every agent
# goes quiet: silence after a wait is announced about half an hour after it was posted, with no later event needed.
# A stranger's activity never starts a run. The status issue shows when it last ran; run it from the Actions tab to
# refresh it by hand.
#
# There is deliberately no pull_request or pull_request_review trigger: for those events GitHub runs the pull
# request's own copy of this file, so a pull request could change what runs with a write token before anyone reviews
# it. Every trigger below runs main's copy of this file against main's script.
#
# The comments this posts use GITHUB_TOKEN, and GitHub starts no workflow from GITHUB_TOKEN's own events, so it cannot
# trigger itself. If it ever posts with another token (a personal one, or the owner's), every nudge would start a new
# run: only the 5-minute throttle would then stop the loop, so add an explicit guard before making that change.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  status:
    # Only the owner's account (every agent) and the clocks start a run. If the repository moves to an organisation,
    # repository_owner becomes the organisation and these event runs stop: change it to the owner's login then. The
    # same holds if agents post through a separate account: add that login here, or only the schedule is left.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.actor == github.repository_owner
    # At job level, so a stranger's comment, whose job is skipped, never takes a waiting run's place in the queue.
    concurrency:
      group: agent-status
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # A waiting run sleeps through the 5-minute gap and up to 35 minutes more; everything else takes seconds. It
    # holds this group while it waits, so a later event queues behind it; that run re-reads everything, so nothing
    # is lost, only delayed.
    timeout-minutes: 50
    steps:
      # Main's code, whatever event started the run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Find stalled work and announce it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        # The clocks always run. An activity run waits out the rest of the 5-minute gap instead of skipping, then
        # waits for the next deadline, so a deadline that passes in silence is still announced.
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            python3 tools/agents/stalls.py --nudge
          else
            python3 tools/agents/stalls.py --nudge --min-gap 5 --wait-for-deadline
          fi
