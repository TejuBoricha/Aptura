name: CI

# The checks tools/gate.ps1 runs (compile tests, run unit tests, lint), plus an R8 release build on every pull request
# so a shrinker problem shows up before a release does. The local gate runs that release build only for changes that
# can affect it (tools/gate/release_scope.py), so CI is the authority for it. No secrets are needed: the release build
# is left unsigned.
#
# Parallelized verification pipeline: unit tests, lint, and release build run concurrently across separate runners,
# fanning into a final 'verify' status check required by branch rulesets.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read # tools/agents/pr_checks.py lists other open pull requests and their files

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Several AI agents work in parallel (AGENTS.md). Runs first because it takes seconds: attribution trailers,
      # one open PR per hot file, one open PR per issue.
      - name: Agent coordination checks
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The rules come from main, not from this pull request: a PR that edits pr_checks.py or hot-files.txt must
        # not be judged by its own edited copy. Its own copy's tests still run, so a broken change fails here.
        run: |
          python3 -m unittest discover -s tools/agents
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/base"
          mkdir -p "$RUNNER_TEMP/rules"
          if git archive origin/base tools/agents | tar -x -C "$RUNNER_TEMP/rules"; then
            python3 "$RUNNER_TEMP/rules/tools/agents/pr_checks.py"
          else
            echo "::warning::The base branch has no tools/agents yet; using this pull request's copy."
            python3 tools/agents/pr_checks.py
          fi

      # Fails if a signing key, private key or .env file is tracked (SEC-01). .gitignore cannot stop `git add -f`.
      # Runs on every push and pull request, and its own tests show it fails when it should.
      - name: Secret file guard
        run: |
          python3 -m unittest discover -s tools/security
          python3 tools/security/check_no_secret_files.py

      # tools/gate/release_scope.py lets the local gate skip the R8 release builds for changes that cannot affect them.
      # A wrong list would let a release-affecting change skip them locally, so its tests run on every push and PR.
      - name: Gate scoping tests
        run: python3 -m unittest discover -s tools/gate

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      # Pinned to v5 on purpose. v6 moves Gradle's build cache into a proprietary, commercially licensed component
      # under Gradle's Terms of Use; v5 is the last MIT release and already runs on Node 24.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Unit tests and Kover coverage verification (min 70% lines)
        run: ./gradlew testDebugUnitTest koverXmlReportDebug koverVerifyDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload Kover coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-report
          path: app/build/reports/kover/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      # assembleRelease is finalized by verifyReleaseApk and bundleRelease is finalized by verifyReleaseBundle:
      # both fail if the shipped APK/AAB or R8 mapping contains a network stack or telemetry SDK.
      - name: Release APK build and shipped-code invariants
        run: ./gradlew assembleRelease --stacktrace

      - name: Release App Bundle (.aab) build and shipped-code invariants
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release invariant reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-invariant-reports
          path: app/build/invariants/

  verify:
    needs: [unit-tests, lint, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidate verification results
        run: |
          failed=0
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "::error::Job 'unit-tests' failed or was cancelled (result: ${{ needs.unit-tests.result }})."
            failed=1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Job 'lint' failed or was cancelled (result: ${{ needs.lint.result }})."
            failed=1
          fi
          if [ "${{ needs.release.result }}" != "success" ]; then
            echo "::error::Job 'release' failed or was cancelled (result: ${{ needs.release.result }})."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All verification checks (unit-tests, lint, release) passed successfully."

  # The unit gate is JVM-only. DocumentsProviderRenameTest needs a real DocumentsProvider and ApturaAppE2eTest needs a
  # real activity, so they run here on an API 35 tablet image. This is the same command verified locally; the job is
  # deliberately separate so an emulator outage cannot hide a unit, lint or release regression.
  connected:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      # Linux runners expose /dev/kvm; this makes it usable by the emulator process.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an API 35 tablet
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          # The AVD's default 6 GB data partition is checked at 1.2x that size (7.4 GB) before the emulator creates it,
          # and a runner has about 7.1 GB free, so it exits with "Not enough space to create userdata partition" and
          # never boots. 4 GB needs 4.9 GB, which fits with room for the build, and is plenty for one APK and test media.
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connected-reports
          path: app/build/reports/androidTests/
