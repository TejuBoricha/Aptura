name: Nightly Matrix & Corpus

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-corpus:
    name: Generate and verify B0.0 synthetic corpus (QA-07)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate synthetic subtitles, metadata bombs, adversarial media, instrumented clips & matrix
        run: |
          python3 tools/corpus/generate_subtitles.py
          python3 tools/corpus/generate_metadata_bombs.py
          python3 tools/corpus/generate_adversarial_media.py
          python3 tools/corpus/generate_scale_library.py --count 1000 --name scale_1k
          python3 tools/corpus/generate_instrumented.py
          python3 tools/corpus/generate_media_matrix.py
          test -s fixtures/manifest.csv
          wc -l fixtures/manifest.csv

      - name: Verify committed fixture corpus unit suite
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Run CommittedCorpusFixturesTest
        run: ./gradlew testDebugUnitTest --tests "org.aptura.player.core.media.CommittedCorpusFixturesTest" --stacktrace

      - name: Upload corpus manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-corpus-manifest
          path: fixtures/manifest.csv

  connected-matrix:
    name: Connected smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: google_apis
            profile: pixel
          - api-level: 36
            target: google_apis
            profile: pixel_7

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Every instrumented test on both ends of the supported range (minSdk 26, newest API). The tests seed their own
          # media for the API level they run on (MediaSeeding.kt), so no leg needs a test filter (#186).
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-connected-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/

  # The R8-minified release build is what ships, and no other job starts it: ci.yml only builds it. Instrumented tests
  # cannot run against it (the test runner needs classes R8 removed, and keep rules for that would change what R8 makes),
  # so this installs the real signed release APK and drives it from outside. See tools/smoke/release_smoke.py.
  release-smoke:
    name: Release APK smoke (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Smoke script tests
        run: python3 -m unittest discover -s tools/smoke

      # An unsigned APK cannot be installed, and the repo holds no signing key. Make a throwaway one for this run only:
      # random password, masked in the log, kept in the runner's temp directory, never stored or uploaded.
      - name: Create a throwaway signing key
        run: |
          pass="$(openssl rand -hex 16)"
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass "$pass" -keypass "$pass" \
            -alias smoke -keyalg RSA -keysize 2048 -validity 2 -dname "CN=aptura-nightly-release-smoke"
          {
            echo "APTURA_SIGNING_STORE_FILE=$RUNNER_TEMP/smoke.jks"
            echo "APTURA_SIGNING_STORE_PASSWORD=$pass"
            echo "APTURA_SIGNING_KEY_ALIAS=smoke"
            echo "APTURA_SIGNING_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Build the signed release APK (R8, shipped-code invariants)
        run: ./gradlew assembleRelease --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and exercise the release APK on an API 35 tablet
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/smoke/release_smoke.py app/build/outputs/apk/release/app-x86_64-release.apk --logcat-out release-smoke-logcat.txt

      - name: Upload the logcat of the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-release-smoke-logcat
          path: release-smoke-logcat.txt
          if-no-files-found: ignore

  dependency-advisories:
    # A library that arrives through another one (Guava, through Media3, which is held at 1.5.x) never gets a Dependabot
    # update, and an advisory can be published against a version that was clean yesterday. So the libraries that really
    # ship are checked against the OSV database every night. Only public library coordinates leave the runner.
    name: Known advisories in the release dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Write the release runtime dependency list
        run: ./gradlew writeReleaseRuntimeDependencies --stacktrace

      - name: Check every library against the OSV database
        run: python3 tools/security/osv_check.py app/build/invariants/release-runtime-dependencies.txt
