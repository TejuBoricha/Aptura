name: Release Artifacts & Checksums

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-artifacts:
    name: Build verified APK, AAB & SHA256SUMS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build & verify release APK and App Bundle
        run: |
          ./gradlew assembleRelease --stacktrace
          ./gradlew bundleRelease --stacktrace

      - name: Stage release artifacts and generate SHA256SUMS.txt
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/release/*.apk release-out/
          cp app/build/outputs/bundle/release/*.aab release-out/
          cp app/build/outputs/mapping/release/mapping.txt release-out/mapping.txt
          cp app/build/invariants/apk-verification.txt release-out/apk-verification.txt
          cp app/build/invariants/bundle-verification.txt release-out/bundle-verification.txt
          cp app/build/invariants/release-dependencies.txt release-out/release-dependencies.txt
          (cd release-out && sha256sum * > SHA256SUMS.txt)
          cat release-out/SHA256SUMS.txt

      - name: Upload release verification artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aptura-release-artifacts
          path: release-out/

      - name: Attach artifacts to prerelease when triggered by tag v*
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" release-out/* \
            --title "Aptura $TAG (pre-release)" \
            --prerelease \
            --notes "Automated release verification build (`verifyReleaseApk` + `verifyReleaseBundle`). Unsigned unless Play App Signing / upload keystore is configured locally. See `SHA256SUMS.txt` and `release-dependencies.txt`."
