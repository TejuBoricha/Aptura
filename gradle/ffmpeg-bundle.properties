# The self-built FFmpeg audio libraries the app links (LEG-02, DEC-014, DEC-020, DEC-023, DEC-024).
#
# CI builds them (.github/workflows/ffmpeg-audio.yml), holds every library to tools/ffmpeg/verify_lgpl_symbols.py, packs them
# with the exact FFmpeg source, the build records and the licence texts, and publishes the zip as a GitHub release.
# app/build.gradle.kts downloads it, checks the SHA-256 below and unpacks it, so no NDK is needed on a developer machine
# and the source sits on the same server as the binaries (LGPL-2.1 section 6, FFmpeg's compliance checklist).
#
# To move to a new bundle: publish it with that workflow, then change `url`, `sha256` and `decoders` together. A zip whose
# checksum differs is refused. The checksum is the one in THIS file (the release's SHA256SUMS.txt lists the files inside the
# zip, not the zip). Check it independently before pinning: download the zip and run
# `gh attestation verify <zip> --repo TejuBoricha/Aptura`, which ties the digest to the ffmpeg-audio.yml run on main that built
# it. Nothing here is a secret: the repository and the release are public.
#
# History: r1 (alac, pcm_alaw, pcm_mulaw) -> r2 (adds ac3, DEC-021; same FFmpeg n9.0.2, commit 946fcce07b6d...).
#
# `decoders` is what that bundle is declared to contain (FFmpeg decoder names, comma separated). It is not read by the build: the
# unit tests hold the bundle's own build records to it, and hold it to tools/ffmpeg/approved_decoders.txt (what policy allows),
# so policy may lead the pin by one step while a new bundle is built and published, but the pin can never name, and the bundle can
# never contain, a decoder that policy does not allow. Change it together with `url` and `sha256`.
url=https://github.com/TejuBoricha/Aptura/releases/download/ffmpeg-audio-n9.0.2-r2/aptura-ffmpeg-audio-n9.0.2-r2.zip
sha256=25a6e702826900607a101cb1eb4c0cd659024555ce7d742161a4abe1152345a9
decoders=ac3,alac,pcm_alaw,pcm_mulaw
